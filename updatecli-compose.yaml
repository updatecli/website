policies:
  - name: Local Updatecli Website Policies
    config:
      - updatecli/updatecli.d/
    values:
      - updatecli/values.d/scm.yaml

  - name: Handle Nodejs version in githubaction
    policy: ghcr.io/updatecli/policies/nodejs/githubaction:0.12.0@sha256:9bd7725a2f31dc104bb8086458febb7fce9d66347dff560ba3d45053d97d9b19
    values:
      - updatecli/values.d/scm.yaml
    valuesinline:
      versionpattern: "~24"
      automerge: true

  - name: Handle Nodejs version in Netlify
    policy: ghcr.io/updatecli/policies/nodejs/netlify:0.11.0@sha256:d6b558c5cec0068885b84c3dcbd0cb2e297a8a14d6f909ceb28c5a27e12d7baa
    values:
      - updatecli/values.d/scm.yaml
    valuesinline:
      versionpattern: "~24"
      automerge: true

  - name: Handle HUGO version in netlify
    policy: ghcr.io/updatecli/policies/hugo/netlify:0.11.0@sha256:7a01a6b7a63ecb93b55becfe82ec20e3e5093645cdcd5ca2f7c1e4532e70ceb5
    values:
      - updatecli/values.d/scm.yaml
    valuesinline:
      automerge: true

  - name: Handle HUGO version in GitHub action
    policy: ghcr.io/updatecli/policies/hugo/githubaction:0.12.0@sha256:0178e0dd1072ffe8d358123eae1561740af127955a1a051e447e03666a1f9f78
    values:
      - updatecli/values.d/scm.yaml
    valuesinline:
      automerge: true

  - name: Handle NPM version in netlify
    policy: ghcr.io/updatecli/policies/npm/netlify:0.12.0@sha256:4ac30401a48a314ca203c9890d885a3fe12588da2f951f70fbbe8a33e12399f2
    values:
      - updatecli/values.d/scm.yaml
    valuesinline:
      automerge: true

  - name: NPM autodiscovery
    policy: ghcr.io/updatecli/policies/npm/autodiscovery:0.13.0@sha256:a6ae41383d6e0ebd8a139b44f441134b9a6e881aa30393e1298529d73df27d83
    values:
      - updatecli/values.d/scm.yaml
    valuesinline:
      automerge: true
      groupby: individual
      spec:
        ignoreversionconstraints: true

  - name: Handle Updatecli version in GitHub action
    policy: ghcr.io/updatecli/policies/updatecli/githubaction:0.10.0@sha256:666a807c7e1f260fa3d9357fd2b60c57f5dedbd6f29f97b6f82d882ed4058608
    values:
      - updatecli/values.d/scm.yaml
    valuesinline:
      pipeline:
        labels:
          monitor: active
          ecosystem: updatecli
          release: updatecli
          policy: gha

  - name: Update Updatecli policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.9.0@sha256:67026697434a99f6e01a662caa662e8ed02e39e8abf8f7399ab673d113abb360
    values:
      - updatecli/values.d/scm.yaml
    valuesinline:
      spec:
        files:
          - "updatecli-compose.yaml"
          - "updatecli-compose-release.yaml"
      pipeline:
        labels:
          monitor: active
          ecosystem: updatecli

  - name: Update githubactions
    policy: ghcr.io/updatecli/policies/autodiscovery/githubaction:0.5.0@sha256:7dd97c132950994dc3fb89e0bc77037358e9168d8e6980705b2a06e444270626
    values:
      - updatecli/values.d/scm.yaml

  - name: Configure Updatecli workflows
    id: updatecli
    policy: ghcr.io/updatecli/policies/updatecli/githubaction/scaffold:0.2.0@sha256:abfecc050f1598f0ee835d673ddc06c89f71319c64672486e608d6f47f0d8987
    valuesinline:
      gha:
        npm:
          enabled: true
        udash:
          enabled: true
        update:
          cron: "0 3 * * *"
          matrix:
            - target_name: "existing pipelines"
              apply_args: "--existing-only=true"
            - target_name: "monitored pipelines"
              apply_args: "--labels=monitor:active"
      pipeline:
        labels:
          ecosystem: "updatecli"
          policy: scaffold
          monitor: active
