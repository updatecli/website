name: Discover Go module updates
pipelineid: go/autodiscovery

# Copied onto every pipeline the crawler generates, and stored with every report.
labels:
  team: platform
  ecosystem: go
  monitor: passive

# The scm is what files these reports under a Git repository on the Git dashboard.
scms:
  default:
    kind: github
    spec:
      owner: my-org
      repository: my-service
      branch: main
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'

autodiscovery:
  scmid: default
  crawlers:
    golang:
