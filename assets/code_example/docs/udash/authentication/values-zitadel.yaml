auth:
  enabled: true
  mode: zitadel
  visibility: public
  # Used by the frontend for OIDC discovery.
  issuer: https://my-instance.region.zitadel.cloud
  clientid: "123456789012345678@udash"
  audience:
    - https://udash.example.com/api
  # Zitadel rejects the token at the API unless the project audience scope is requested.
  scope: "openid profile email offline_access urn:zitadel:iam:org:project:id:123456789012345678:aud"
  zitadel:
    domain: my-instance.region.zitadel.cloud
    keyFile:
      # Reference a Secret you manage yourself rather than inlining the key.
      existingSecret: udash-zitadel-key
      key: key.json
  # No roles block needed: zitadel mode reads the project roles claim by default,
  # and grants publisher to the udash.publisher project role.
