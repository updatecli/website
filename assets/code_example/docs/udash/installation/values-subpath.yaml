# Subpath routing: the frontend lives under /udash on a shared hostname.
# ingress.paths.front and front.appBasePath must carry the same value, and the
# prefix has to be stripped before the request reaches nginx.
#
# The API keeps its own top-level /api path: the server only ever serves /api,
# and nothing rewrites the path on same-host routing.
ingress:
  enabled: true
  hosts:
    - host: tools.example.com
  paths:
    front: "/udash"
    server: "/api"
  traefik:
    stripPrefix:
      # Creates a StripPrefix Middleware for /udash and wires its annotation.
      # Requires the Traefik CRDs (traefik.io/v1alpha1) in the cluster.
      enabled: true

front:
  apiBaseUrl: "/api"
  appBasePath: "/udash"
