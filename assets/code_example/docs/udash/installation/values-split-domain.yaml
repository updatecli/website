# Split-domain routing: the API answers on its own hostname.
# A second Ingress is created for ingress.server.host, and the browser needs an
# absolute front.apiBaseUrl because the API is no longer same-origin.
ingress:
  enabled: true
  hosts:
    - host: udash.example.com
  paths:
    front: "/"
    server: "/api"
  server:
    host: api.example.com
    # The server serves /api natively, so nothing needs rewriting here.
    path: "/api"
    tls:
      - secretName: udash-api-tls
        hosts:
          - api.example.com

front:
  apiBaseUrl: "https://api.example.com/api"
  appBasePath: "/"
