name: Bump the base image
pipelineid: docker/base-image

labels:
  ecosystem: docker
  monitor: active

# The scm files the reports under this Git repository in Udash.
scms:
  default:
    kind: github
    spec:
      owner: my-org
      repository: my-service
      branch: main
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'

sources:
  alpine:
    name: Get the latest Alpine version
    kind: dockerimage
    spec:
      image: alpine
      versionfilter:
        kind: semver

targets:
  dockerfile:
    name: Update the Alpine base image
    kind: dockerfile
    scmid: default
    sourceid: alpine
    spec:
      file: Dockerfile
      instruction:
        keyword: FROM
        matcher: alpine
